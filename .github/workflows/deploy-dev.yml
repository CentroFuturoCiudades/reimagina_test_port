name: deploy-dev

# Push a dev: checks, imagen al ACR y deploy a la app de Lyra en dev.
# Identidad de Azure por OIDC (GitHub Environment dev; ver docs/deployment.md).
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      REIMAGINA_TEST_DSN: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
      - run: uv sync --locked
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run lyra-plugin check-manifest
      - run: uv run pytest -q

  deploy:
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    env:
      RG: ${{ vars.RESOURCE_GROUP }}
      ACR_NAME: ${{ vars.ACR_NAME }}
      # ca-lyra-dev (contenedores api, worker y redis). Vacío: solo sube la imagen.
      LYRA_APP: ${{ vars.LYRA_APP_NAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login a ACR
        run: |
          az acr login --name "$ACR_NAME"
          echo "REGISTRY=$(az acr show -n "$ACR_NAME" --query loginServer -o tsv)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/reimagina-lyra:${{ github.sha }}
            ${{ env.REGISTRY }}/reimagina-lyra:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Worker primero: así la API no anuncia métricas que el worker aún no tiene.
      - name: Deploy
        if: env.LYRA_APP != ''
        run: |
          IMAGE="$REGISTRY/reimagina-lyra:${{ github.sha }}"
          for container in worker api; do
            az containerapp update -n "$LYRA_APP" -g "$RG" \
              --container-name "$container" --image "$IMAGE" -o none
          done
          echo "Desplegado $IMAGE en $LYRA_APP (worker y api)" >> "$GITHUB_STEP_SUMMARY"
