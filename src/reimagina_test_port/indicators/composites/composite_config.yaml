# The composite trees: each node with `children` is a composite, every other node
# an indicator (a leaf). Each composite becomes its own Lyra metric,
# reimagina_composite_<name>, depending on its children: the indicator tables its
# leaves read and the outputs of its child composites (composite_metric.py).
# Composites form a DAG: `trees` lists one or more top-level indices, and a child
# `{ref: <composite>, weight: w}` reuses a composite defined elsewhere instead of
# repeating it (computed once, read by every parent). A cycle fails.
#
# element: the grain every composite is computed at (blocks or lots).
# boundary: optional, the URL of a GeoParquet (az:// or a path) with the area to
#   read the composites over, such as a city without its rural localities; only
#   the elements inside it get composites. Without it, all of them do.
#
# Leaves:
#   source     the indicator pipeline: accessibility, population_access,
#              built_form, diversity, land_use or streets (the last three,
#              blocks only)
#   variable   its column (distance_m_public_space, density, ...)
#   transform  optional, before normalising: {soft_threshold: distance, k: 5}
#              in the variable's unit (closer is better, 0-1) or
#              {steps: [[limit, score], ...], beyond: 0}
#   compress   optional: pull values beyond 2 SD toward 2-3 SD, with fixed stats
#              {mean, sd, minimum, maximum} of the transformed variable; `true`
#              takes them from the scenario itself, so a scenario's extreme
#              values would change the other elements' scores
#   polarity   positive (more is better) or negative
#   method     ampi (needs reference and goalposts {min, max}) or mpi (mean, sd)
#   weight     its weight in its composite (default 1)
# Composites:
#   label      optional: its name in indicator_catalog (Spanish, as the web shows)
#   phenomenon positive (higher index is better) or negative
#   min_valid  how many children must have a value (default: all)
#   weight     its weight in its parent (default 1)
#   flatten    optional, true: combine the child composites' leaves (each child's
#              weight shared among its leaves as their weights say) instead of
#              their indices, with one penalty; their children must be leaves
#
# Normalised scores sit around 100: AMPI puts the reference at 100 and moves 60
# points across the goalposts; MPI puts the mean at 100 and 10 points per SD.
#
# A project's baseline replaces the references, the compress stats and the
# goalposts of counts (no transform, goalposts other than 0-1) with its own, and
# its forks read them (calibration.py, reimagina_composite_calibration); a fork
# of a project without one fails, and a leaf without a value on the baseline is
# left missing. The values below are only the snapshot graph's.
#
# The plugin registers each composite's composite_<name> key and its inputs in
# indicator_catalog / indicator_input before writing (composites/catalog.py): a
# composite added here needs no migration.
#
# The tree follows composite_indices > uli of MX_Mexicali_2025_ULI.yml:
#
#   index > domain > core measure > indicator
#
# - Domains are the ULI's (its `domains` keys). Only those with an indicator in
#   the database are here: housing and sociodemographics have none yet.
# - Core measures are the sankey's (hoja «Indicadores» de
#   indicadores_por_completar.xlsx), one composite each.
# - Each sankey sub-variable with data is a leaf, in pairs:
#   - «Average distance to closest <poi>»: distance_m_<type>, with the matching
#     ULI indicator's transform (named in its comment): a soft threshold at its
#     distance, or a step for binary access. The ULI scores along the pedestrian
#     network in metres, as distance_m_* is measured.
#   - «Percentage of population with access to <poi> within X m»:
#     share_with_access_<type>, population_with_access_<type> over the block's
#     residents, X being the type's coverage_m in poi_catalog.
# - Blocks without residents have no distance: their leaves, and the composites
#   that need them, are left missing.
# - Weights, as the ULI's: each indicator weighs 1 in its domain, or 1/k in each
#   of k domains. A core measure weighs its indicators over its domains (daily
#   services: 4 / 3), defined in its first domain and reused with `ref`. A pair
#   «distance to X» + «share with access to X» is one indicator (0.5 each), and
#   walkability is one.
# - Domains are `flatten: true`: one imbalance penalty over their core measures'
#   leaves. Core measures are computed only to show them.
# - AMPI reference: the ULI's is the study region average. Here it is the
#   average of the transformed indicator over Base Mexicali's blocks
#   (510bff7c, November 2026), fixed so that a scenario is scored against the
#   baseline and not against itself. The leaves of land use, streets and
#   diversity came later: theirs is over Base Mexicali of project «Mexicali»
#   (1f6abbad, 13 November 2026), as those indicators are not on 510bff7c;
#   diversity's, over Base Mexicali of «Mexicali v2» (ee468973, 17 November
#   2026), the first baseline with it. The leaves whose destinations changed
#   with the categories (fresh food, education, health, manufacturing) and
#   every diversity, over ee468973 rewritten with them (19 November 2026); reachable
#   jobs and job diversity, over ee468973 too (20 November 2026); public transport,
#   over ee468973 with its stops (ingestion/transit.py) added in memory, before they
#   were loaded (20 November 2026); large public green space, likewise with its 5
#   parks (21 November 2026). The compress stats, over ee468973 as recomputed on
#   21 November 2026: its blocks with a value (population SD).
#   Police and fire stations keep the ULI's until there are stations.
# - The snapshot plugin has no land use or streets (they read the scenario from
#   the database): its tree leaves them out, and the composites left empty.
element: blocks
trees:
  - name: index
    label: Índice de entornos vivibles
    phenomenon: positive
    min_valid: 1
    children:
      # -- Social infrastructure ------------------------------------------------
      - name: social_infrastructure
        label: Infraestructura social
        phenomenon: positive
        min_valid: 1
        flatten: true
        children:
          # Acceso a servicios diarios: social infrastructure, mobility and
          # transport, economic development.
          - name: daily_services
            label: Acceso a servicios diarios
            phenomenon: positive
            weight: 1.3333
            children:
              # ULI fresh_food: fresh food within 300 m.
              - name: fresh_food
                weight: 0.5
                source: population_access
                variable: distance_m_fresh_food
                transform: {soft_threshold: 300}
                polarity: positive
                method: ampi
                reference: 0.698
                goalposts: {min: 0, max: 1}
              # Percentage of population with access within 300 m.
              - name: fresh_food_pct
                weight: 0.5
                source: population_access
                variable: share_with_access_fresh_food
                polarity: positive
                method: ampi
                reference: 0.751
                goalposts: {min: 0, max: 1}
              # ULI denue_food_retail: food retail of any kind (4611 and 4621:
              # abarrotes, fresh food, supermarkets, minisupers) within 300 m;
              # the poi_catalog type keeps the name convenience_store.
              - name: convenience
                weight: 0.5
                source: population_access
                variable: distance_m_convenience_store
                transform: {soft_threshold: 300}
                polarity: positive
                method: ampi
                reference: 0.318
                goalposts: {min: 0, max: 1}
              # Percentage of population with access within 300 m.
              - name: convenience_pct
                weight: 0.5
                source: population_access
                variable: share_with_access_convenience_store
                polarity: positive
                method: ampi
                reference: 0.312
                goalposts: {min: 0, max: 1}
              # ULI petrol_250m: a disamenity, 250 m or more from a petrol
              # station scores 1.
              - name: petrol_250m
                weight: 0.5
                source: population_access
                variable: distance_m_petrol_station
                transform: {steps: [[250, 0]], beyond: 1}
                polarity: positive
                method: ampi
                reference: 0.956
                goalposts: {min: 0, max: 1}
              # Percentage of population with access within 250 m (a disamenity: fewer is better).
              - name: petrol_250m_pct
                weight: 0.5
                source: population_access
                variable: share_with_access_petrol_station
                polarity: negative
                method: ampi
                reference: 0.048
                goalposts: {min: 0, max: 1}
              # ULI div_fresh_food_500m: entropy of the fresh food subcategories
              # within 500 m (0-1), as is.
              - name: fresh_food_diversity
                source: diversity
                variable: diversity_fresh_food
                polarity: positive
                method: ampi
                reference: 0.250
                goalposts: {min: 0, max: 1}

          # Acceso a salud, educación y cuidados.
          - name: health_education_care
            label: Acceso a salud, educación y cuidados
            phenomenon: positive
            weight: 6
            children:
              # ULI primary_school: primary schools (and schools of several
              # levels) within 300 m.
              - name: education
                weight: 0.5
                source: population_access
                variable: distance_m_primary_education
                transform: {soft_threshold: 300}
                polarity: positive
                method: ampi
                reference: 0.262
                goalposts: {min: 0, max: 1}
              # Percentage of population with access within 300 m.
              - name: education_pct
                weight: 0.5
                source: population_access
                variable: share_with_access_primary_education
                polarity: positive
                method: ampi
                reference: 0.250
                goalposts: {min: 0, max: 1}
              # ULI primary_healthcare: health care within 300 m.
              - name: primary_healthcare
                weight: 0.5
                source: population_access
                variable: distance_m_health
                transform: {soft_threshold: 300}
                polarity: positive
                method: ampi
                reference: 0.395
                goalposts: {min: 0, max: 1}
              # Percentage of population with access within 300 m.
              - name: primary_healthcare_pct
                weight: 0.5
                source: population_access
                variable: share_with_access_health
                polarity: positive
                method: ampi
                reference: 0.408
                goalposts: {min: 0, max: 1}
              # ULI care_support: care services within 300 m.
              - name: care_support
                weight: 0.5
                source: population_access
                variable: distance_m_care
                transform: {soft_threshold: 300}
                polarity: positive
                method: ampi
                reference: 0.237
                goalposts: {min: 0, max: 1}
              # Percentage of population with access within 300 m.
              - name: care_support_pct
                weight: 0.5
                source: population_access
                variable: share_with_access_care
                polarity: positive
                method: ampi
                reference: 0.225
                goalposts: {min: 0, max: 1}
              # ULI div_education_500m: entropy of the education levels within 500 m (0-1), as
              # is.
              - name: education_diversity
                source: diversity
                variable: diversity_education
                polarity: positive
                method: ampi
                reference: 0.182
                goalposts: {min: 0, max: 1}
              # ULI div_health_500m: entropy of the health services within 500 m (0-1), as
              # is.
              - name: health_diversity
                source: diversity
                variable: diversity_health
                polarity: positive
                method: ampi
                reference: 0.211
                goalposts: {min: 0, max: 1}
              # ULI div_care_500m: entropy of the care services within 500 m (0-1), as
              # is.
              - name: care_diversity
                source: diversity
                variable: diversity_care
                polarity: positive
                method: ampi
                reference: 0.087
                goalposts: {min: 0, max: 1}

          # Acceso a espacios comunitarios, culturales y recreativos.
          - name: community_culture_recreation
            label: Acceso a espacios comunitarios, culturales y recreativos
            phenomenon: positive
            weight: 2
            children:
              # ULI ccr_any: community, culture and recreation within 300 m.
              - name: ccr_any
                weight: 0.5
                source: population_access
                variable: distance_m_community_culture_recreation
                transform: {soft_threshold: 300}
                polarity: positive
                method: ampi
                reference: 0.623
                goalposts: {min: 0, max: 1}
              # Percentage of population with access within 300 m.
              - name: ccr_any_pct
                weight: 0.5
                source: population_access
                variable: share_with_access_community_culture_recreation
                polarity: positive
                method: ampi
                reference: 0.662
                goalposts: {min: 0, max: 1}
              # ULI div_ccr_500m: entropy of the community, culture and recreation places within 500 m (0-1), as
              # is.
              - name: ccr_diversity
                source: diversity
                variable: diversity_community_culture_recreation
                polarity: positive
                method: ampi
                reference: 0.294
                goalposts: {min: 0, max: 1}

          # Índice de caminabilidad: built environment, mobility and transport,
          # social infrastructure. Its four sankey sub-variables, by block; the
          # ULI's walkability index is not in the database.
          - name: walkability
            label: Índice de caminabilidad
            phenomenon: positive
            weight: 0.3333
            children:
              # Net residential density: homes per hectare of residential land;
              # outliers reach 13,000 viv/ha, so they are compressed.
              - name: net_residential_density
                source: land_use
                variable: net_residential_density
                compress: {mean: 69.14, sd: 147.07, minimum: 0.0507, maximum: 13094.2}
                polarity: positive
                method: ampi
                reference: 65.27
                goalposts: {min: 0, max: 400}
              # Commercial land use proportion: share (0-1) of the block's lot
              # area in commerce or offices.
              - name: commercial_land_share
                source: land_use
                variable: commercial_land_share
                polarity: positive
                method: ampi
                reference: 0.117
                goalposts: {min: 0, max: 1}
              # Land use mix: entropy of the lots' land uses by area (0-1).
              - name: land_use_mix
                source: land_use
                variable: land_use_mix
                polarity: positive
                method: ampi
                reference: 0.446
                goalposts: {min: 0, max: 1}
              # Street connectivity: intersections per km² within 1 km; the
              # highest block reaches 181.
              - name: intersection_density
                source: streets
                variable: intersection_density
                polarity: positive
                method: ampi
                reference: 56.5
                goalposts: {min: 0, max: 200}

      # -- Mobility and transport -----------------------------------------------
      - name: mobility_transport
        label: Movilidad y transporte
        phenomenon: positive
        min_valid: 1
        flatten: true
        children:
          - {ref: daily_services, weight: 1.3333}
          - {ref: walkability, weight: 0.3333}
          - {ref: cycling_infrastructure, weight: 0.6667}
          - {ref: street_lighting, weight: 1}
          # Acceso al transporte público: mobility and transport only.
          - name: public_transport
            label: Acceso al transporte público
            phenomenon: positive
            children:
              # ULI public_transport (pt_any): a stop within 300 m. The stops are
              # the transit_stop type's (ingestion/transit.py): IMIP's local bus
              # terminals and OpenStreetMap's stops, 36 in Mexicali, so few blocks
              # have one that close.
              - name: pt_any_300m
                weight: 0.5
                source: population_access
                variable: distance_m_transit_stop
                transform: {soft_threshold: 300}
                polarity: positive
                method: ampi
                reference: 0.013
                goalposts: {min: 0, max: 1}
              # Percentage of population with access within 300 m.
              - name: pt_any_300m_pct
                weight: 0.5
                source: population_access
                variable: share_with_access_transit_stop
                polarity: positive
                method: ampi
                reference: 0.011
                goalposts: {min: 0, max: 1}

      # -- Economic development -------------------------------------------------
      - name: economic_development
        label: Desarrollo económico
        phenomenon: positive
        min_valid: 1
        flatten: true
        children:
          - {ref: daily_services, weight: 1.3333}
          # Acceso a fuentes de empleo.
          - name: employment
            label: Acceso a fuentes de empleo
            phenomenon: positive
            weight: 3
            children:
              # ULI manufacturing_1000m: binary access within 1 km.
              - name: manufacturing_1000m
                weight: 0.5
                source: population_access
                variable: distance_m_manufacturing
                transform: {steps: [[1000, 1]], beyond: 0}
                polarity: positive
                method: ampi
                reference: 0.967
                goalposts: {min: 0, max: 1}
              # Percentage of population with access within 1000 m.
              - name: manufacturing_1000m_pct
                weight: 0.5
                source: population_access
                variable: share_with_access_manufacturing
                polarity: positive
                method: ampi
                reference: 0.966
                goalposts: {min: 0, max: 1}
              # Reachable jobs: workers (DENUE's num_workers) of the
              # establishments within 500 m; the 99th percentile is near 1,500
              # and the highest block reaches 3,600, so they are compressed.
              - name: reachable_jobs
                source: diversity
                variable: reachable_jobs
                compress: {mean: 342.08, sd: 322.23, minimum: 0, maximum: 3594.44}
                polarity: positive
                method: ampi
                reference: 342.1
                goalposts: {min: 0, max: 2000}
              # Job diversity: entropy of the establishments' categories within
              # 500 m (the crosswalk's 20, not the ULI's SCIAN sectors).
              - name: job_diversity
                source: diversity
                variable: diversity_jobs
                polarity: positive
                method: ampi
                reference: 0.321
                goalposts: {min: 0, max: 1}

      # -- Ambient environment --------------------------------------------------
      - name: ambient_environment
        label: Entorno medioambiental
        phenomenon: positive
        min_valid: 1
        flatten: true
        children:
          # Acceso a parques: ambient environment, built environment.
          - name: parks
            label: Acceso a parques
            phenomenon: positive
            weight: 0.5
            children:
              # ULI parks: a park or public open space within 300 m.
              - name: public_open_space
                weight: 0.5
                source: population_access
                variable: distance_m_public_space
                transform: {soft_threshold: 300}
                polarity: positive
                method: ampi
                reference: 0.127
                goalposts: {min: 0, max: 1}
              # Percentage of population with access within 300 m.
              - name: public_open_space_pct
                weight: 0.5
                source: population_access
                variable: share_with_access_public_space
                polarity: positive
                method: ampi
                reference: 0.125
                goalposts: {min: 0, max: 1}
          # Accesibilidad a grandes espacios públicos abiertos: ambient
          # environment, built environment.
          - name: large_public_green_space
            label: Accesibilidad a grandes espacios públicos abiertos
            phenomenon: positive
            weight: 0.5
            children:
              # ULI lpugs: access to a large public green space within 500 m.
              # GHSCI's is public open space of at least 1 ha with mean NDVI of
              # at least 0.2; here a park of at least 1 ha whose lot has at least
              # 20% tree canopy (the lpugs type of poi_catalog).
              - name: lpugs_500m
                weight: 0.5
                source: population_access
                variable: distance_m_lpugs
                transform: {steps: [[500, 1]], beyond: 0}
                polarity: positive
                method: ampi
                reference: 0.009
                goalposts: {min: 0, max: 1}
              # Percentage of population with access within 500 m.
              - name: lpugs_500m_pct
                weight: 0.5
                source: population_access
                variable: share_with_access_lpugs
                polarity: positive
                method: ampi
                reference: 0.009
                goalposts: {min: 0, max: 1}

      # -- Built environment ----------------------------------------------------
      - name: built_environment
        label: Ambiente construido
        phenomenon: positive
        min_valid: 1
        flatten: true
        children:
          - {ref: parks, weight: 0.5}
          - {ref: large_public_green_space, weight: 0.5}
          - {ref: walkability, weight: 0.3333}
          - {ref: cycling_infrastructure, weight: 0.6667}
          - {ref: street_lighting, weight: 1}

      # -- Safety ---------------------------------------------------------------
      - name: safety
        label: Seguridad y protección
        phenomenon: positive
        min_valid: 1
        flatten: true
        children:
          # Presencia de infraestructura ciclista: safety, mobility and
          # transport, built environment. Each a share (0-1) of the street
          # length within 500 m of the block.
          - name: cycling_infrastructure
            label: Presencia de infraestructura ciclista
            phenomenon: positive
            weight: 0.6667
            children:
              # Bicycle lanes coverage: streets with a bike lane, shared or
              # protected.
              - name: bike_lane_coverage
                source: streets
                variable: bike_lane_coverage
                polarity: positive
                method: ampi
                reference: 0.0051
                goalposts: {min: 0, max: 1}
              # Protected bicycle lanes coverage (ULI
              # ext_protected_cycling_street_pct).
              - name: protected_bike_lane_coverage
                source: streets
                variable: protected_bike_lane_coverage
                polarity: positive
                method: ampi
                reference: 0.0004
                goalposts: {min: 0, max: 1}
          # Seguridad personal y vial (cobertura de alumbrado público): safety,
          # mobility and transport, built environment.
          - name: street_lighting
            label: Seguridad personal y vial (alumbrado público)
            phenomenon: positive
            weight: 1
            # Police and fire stations have no source yet: the lighting alone
            # scores the measure until they do.
            min_valid: 1
            children:
              # Presence of street lighting: share of the street length with
              # lights.
              - name: street_lighting_coverage
                source: streets
                variable: street_lighting_coverage
                polarity: positive
                method: ampi
                reference: 0.455
                goalposts: {min: 0, max: 1}
              # ULI police_2km: a police station within 2 km, soft threshold
              # (the sheet's «% of the population with coverage of police
              # stations»). Reference: the ULI's, until there are stations.
              - name: police_2km
                source: population_access
                variable: distance_m_police_station
                transform: {soft_threshold: 2000}
                polarity: positive
                method: ampi
                reference: 0.615
                goalposts: {min: 0, max: 1}
              # ULI fire_3km: a fire station within 3 km, soft threshold (the
              # sheet's «coverage of emergency services»).
              - name: fire_3km
                source: population_access
                variable: distance_m_fire_station
                transform: {soft_threshold: 3000}
                polarity: positive
                method: ampi
                reference: 0.596
                goalposts: {min: 0, max: 1}
