# Mexicali (02002): exe_reimagina's sources (src/pipeline/cities/mexicali.toml),
# laid out as reimagina_pipelines_lab's pipelines/ingestion/cities/mexicali.yaml.
#
# Everything is read from the CFC data lake (account cfcetlsadls) with
# DefaultAzureCredential: the worker's managed identity, or `az login` locally.
city: mexicali
name: Mexicali
ent_code: "02"
muni_code: "002"
# Metric CRS used for areas, distances and the height rasters.
crs: EPSG:32611

sources:
  blocks:
    uri: az://cleaned/inegi/marco_geostadistico/2024/manzanas_urbanas.parquet/CVE_ENT=02/CVE_MUN=002
  census:
    uri: az://cleaned/inegi/censo/manzanas_2020.parquet/entidad=2/mun=2
  parcels:
    uri: az://raw/por_estado/02_baja_california/002_mexicali/imip/PRED_CAT_CP/PREDIOS_CAT_CP.shp
    params:
      # Cadastral columns joined with "-" into each lot's key.
      key_columns: [Numdel, Colonia, Manzana, Lote, Fraccion]
  zoning:
    uri: az://sandbox/projects/EXE/raw/normativa/Predios (Normativa sintesis).geojson
    # Source column -> internal name; a lot takes the containing polygon, else the
    # nearest within max_distance_m.
    params:
      columns: {USOSUELO24: zoning, Max_cos: max_cos, Max_cus: max_cus, Dens_U_max: max_density}
      max_distance_m: 3.0
  # IMIP's existing land use 2024 (raw/.../imip/USOS_DE_SUELO_EXITS_24, with 17
  # gaps filled and 7 polygons enlarged): the zoning of every lot, in the plan's
  # vocabulary (USOSUELO24). The plan covers Condesa only (17 % of the lots) and
  # zones the lots this file does not; it still gives max_cos, max_cus and
  # max_density. Remove to use the plan alone.
  existing_land_use:
    uri: az://cleaned/por_estado/02_baja_california/002_mexicali/imip/uso_de_suelo/usos_de_suelo_finales.geojson
    params:
      column: USOSUELO24
      max_distance_m: 3.0
  heights:   # Open Buildings 2.5D temporal tiles and their manifests
    uri: az://sandbox/projects/EXE/cleaned/open_buildings_temporal_data_v1_mx
    params:
      year: "2023"
      manifests_uri: az://sandbox/projects/EXE/raw/open_buildings_temporal_data_v1_mx
  # Raw amenity layers, turned into the amenities file by the raw_amenities step's
  # normalizer: IMIP's equipment layers, one geoparquet each (edu_basica, esp_pub...).
  # One source per kind: these categories come only from the amenities file, the
  # rest (schools, health, care...) only from the DENUE. IMIP covers parks, sports
  # and culture far better (366 sports and 339 culture places, against 18 and 47);
  # the DENUE has schools with their SCIAN level and workers.
  amenities:
    uri: az://cleaned/por_estado/02_baja_california/002_mexicali/imip/equipamiento
    params:
      normalizer: imip
      categories: [public_space, sports_recreation, cultural_facility]
  denue:   # INEGI DENUE 05_2025 as published: amenities and establishments by the SCIAN crosswalk
    uri: az://raw/inegi/denue/02_baja_california/denue_02_0525_csv/conjunto_de_datos/denue_inegi_02_.csv
    params: {municipio: Mexicali, encoding: latin-1}
  # Street network (ingestion/network.py, reimagina_street_network): OpenStreetMap
  # over the blocks' convex hull plus margin_m, within the municipality
  # (boundary_uri: keeps Calexico out), through Overpass. The filter is the pedestrian
  # network of MX_Mexicali_2025_ULI.yml (`network.pedestrian`): it keeps private
  # and gated streets, which osmnx's walk filter drops (Condesa and the gated
  # communities), and retain_all keeps pieces apart from the rest. The H5 goes to
  # output_prefix, named by its contents, and becomes the project's
  # road_network_uri.
  streets:
    uri: osm://overpass
    params:
      custom_filter: >-
        ["highway"]["area"!~"yes"]
        ["highway"!~"motorway|proposed|construction|abandoned|platform|raceway|emergency_bay"]
        ["service"!~"slipway|emergency_access|parking_aisle|driveway|drive-through"]
        ["access"!~"no|forestry|emergency|delivery|agricultural|customers|military|permit|unknown"]
      retain_all: true
      margin_m: 500
      boundary_uri: az://cleaned/inegi/marco_geostadistico/2024/areas_municipales.parquet/CVE_ENT=02/CVE_MUN=002
      output_prefix: az://sandbox/projects/EXE/cleaned/vialidades
      # Merging a file of streets (optional): snap to a network node, split a
      # network edge, bridge a gap; from exe_reimagina's Condesa network.
      snap_m: 15
      split_max_m: 60
      connector_max_m: 5
  # right_of_way elements over that network (ingestion/streets.py):
  # streetlights from INEGI's 2020 housing inventory block faces (national, one file
  # per state): a street takes the faces within max_distance_m; ALUMPUB 1 lit, 3 not.
  # In the package's data folder (relative paths are), as published by INEGI.
  street_lighting:
    uri: data/inegi/02_Frentes_INV2020_shp.zip
    params:
      member: 02_Frentes_INV2020_shp/INV2020_IND_EU_FTE_02.shp
      where: {CVE_MUN: "002"}
      column: ALUMPUB
      lit: ["1"]
      unlit: ["3"]
      max_distance_m: 25
  # bands.use: IMIP's existing bike lanes, Mexicali's own; a street within 15 m of
  # one has it. In the package's data folder.
  bike_lanes:
    uri: data/mexicali/ciclovia_exist.geojson
    params:
      type_column: TIPO
      protected: [SEGREGADO INDEPENDIENTE, EXCLUSIVO DE TRAZO INDEPENDIENTE]
      max_distance_m: 15

params:
  lots:   # exe_reimagina cities/mexicali.toml values
    presence_threshold: 0.5
    height_percentile: 95.0
    average_level_height: 2.7
    gsd_pixel: 0.5
    mf_min_units: 1.5
  amenities: {default_capacity: 1}
  # An amenity or establishment goes to the lot holding it, else the nearest lot
  # within this distance (urban_fabric.md's placement distance), as a point at the
  # lot's center; farther, it is not loaded.
  points: {lot_max_distance_m: 50.0}
  # Space allocation by lot type, until it is computed per lot (ingestion_pipelines.md):
  # each land use's share of built space for housing (0-100). Mixed use: 80 housing,
  # 20 other. Lots without land use get none.
  space_allocation:
    housing.floor_share:
      single_family: 100
      multifamily: 100
      mixed_use: 80
      commerce: 0
      office: 0
      industrial: 0
      amenity: 0
