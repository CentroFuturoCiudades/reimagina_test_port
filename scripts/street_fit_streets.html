<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calles Condesa</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/deck.gl@9.1.14/dist.min.js"></script>
<style>
:root { --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a66; --line: #e2e0da; --accent: #2f6fd6; --soft: #f1efea; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #161615; --panel: #20201e; --ink: #ecebe7; --muted: #9c9a94; --line: #34332f; --accent: #7aa7f0; --soft: #2a2a27; } }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
#app { display: grid; grid-template-columns: 360px 1fr; height: 100%; }
#side { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 16px; }
#mapwrap { position: relative; } #map { position: absolute; inset: 0; }
h1 { font-size: 17px; margin: 0 0 2px; } .sub { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 0 8px; font-weight: 600; }
.stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
.stat { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
.stat b { display: block; font-size: 16px; font-variant-numeric: tabular-nums; } .stat span { color: var(--muted); font-size: 11px; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button { border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 6px; padding: 5px 9px; font: inherit; font-size: 13px; cursor: pointer; }
.seg button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
label.chk { display: flex; align-items: center; gap: 8px; margin: 3px 0; cursor: pointer; font-size: 13px; }
.legend div { display: flex; align-items: center; gap: 8px; margin: 3px 0; font-size: 13px; }
.sw { width: 18px; height: 10px; border-radius: 2px; flex: none; }
input[type=search] { width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); font: inherit; }
.out a { color: var(--accent); cursor: pointer; text-decoration: underline; display: block; font-size: 13px; margin: 2px 0; }
#detail { background: var(--soft); border-radius: 8px; padding: 10px 12px; }
#detail.empty { color: var(--muted); font-size: 13px; }
#detail h3 { margin: 0; font-size: 15px; } #detail .k { color: var(--muted); font-size: 11px; word-break: break-all; margin-bottom: 8px; }
#detail table { border-collapse: collapse; width: 100%; font-size: 13px; }
#detail td { padding: 2px 0; border-bottom: 1px solid var(--line); } #detail td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
.cap { font-size: 12px; color: var(--muted); margin: 8px 0 2px; } .cap b { color: var(--ink); }
svg text { font-family: system-ui, sans-serif; }
.warn { color: #c2272d; font-size: 12px; margin-top: 6px; }
@media (max-width: 760px) { #app { grid-template-columns: 1fr; grid-template-rows: 55% 1fr; } #side { order: 2; border-right: 0; border-top: 1px solid var(--line); } }
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <h1>Calles · Condesa</h1>
    <div class="sub">Derechos de vía del porte (<code>street_fit</code>, OSM <code>drive</code>) dibujados como en el lab: banquetas, carriles, camellón y cruces.</div>
    <div class="stats" id="stats"></div>

    <h2>Vista</h2>
    <div class="seg" id="views"></div>
    <div id="axisopts" style="margin-top:8px">
      <div class="seg" id="modes"></div>
      <label class="chk" style="margin-top:6px"><input type="checkbox" id="real"> Grosor = ancho real</label>
    </div>

    <h2>Capas</h2>
    <label class="chk"><input type="checkbox" id="l-sat"> Satélite (Esri)</label>
    <label class="chk"><input type="checkbox" id="l-lots" checked> Lotes</label>
    <label class="chk"><input type="checkbox" id="l-lab"> Contorno del lab</label>
    <label class="chk"><input type="checkbox" id="l-axis"> Ejes sobre las bandas</label>

    <h2>Leyenda</h2>
    <div class="legend" id="legend"></div>

    <h2>Tramo seleccionado</h2>
    <div id="detail" class="empty">Haz clic en una calle para ver su corte transversal y compararlo con el lab.</div>

    <h2>Buscar</h2>
    <input type="search" id="q" placeholder="llave (u-v-k) o nombre">
    <div class="out" id="results"></div>

    <h2>Calidad del fit</h2>
    <div id="quality"></div>

    <h2>Revisar</h2>
    <div class="out" id="review"></div>
  </aside>
  <div id="mapwrap"><div id="map"></div></div>
</div>
<script>
const D = /*DATA*/null;
const [X0, Y0] = D.origin;
const dec = q => { const out = []; for (let k = 0; k < q.length; k += 2) out.push([X0 + q[k] / 1e6, Y0 + q[k + 1] / 1e6]); return out; };
const shapes = (polys, extra = () => ({})) => polys.flatMap((rs, i) => rs.map(r => ({ polygon: dec(r), i, ...extra(i) })));

const R = D.row, P = D.part, J = D.junction, LB = D.lab, S = D.stats;
const KIND = ["sidewalk", "lanes", "median", "shared_lanes", "protected_bike_lane"];
const KIND_ES = ["Banqueta", "Carriles", "Camellón", "Carriles compartidos", "Ciclovía protegida"];
const RGB = [[214, 211, 205], [63, 63, 70], [101, 163, 13], [224, 138, 44], [47, 111, 214]];
const hex = c => "#" + c.map(v => v.toString(16).padStart(2, "0")).join("");

const rowShapes = shapes(R.poly), partShapes = shapes(P.poly), junctionShapes = shapes(J.poly);
const INSIDE = new Set(R.inside), insideShapes = rowShapes.filter(d => INSIDE.has(d.i));
const labShapes = shapes(LB.poly), lotShapes = D.lots.flatMap(rs => rs.map(r => ({ polygon: dec(r) })));
const axes = R.axis.map((q, i) => ({ path: dec(q), i }));
const marks = D.marks.map(q => ({ path: dec(q) }));
const partsOf = {}; P.row.forEach((r, k) => (partsOf[r] ||= []).push(k));

const fmt = (v, d = 1) => v == null ? "—" : v.toLocaleString("es-MX", { maximumFractionDigits: d, minimumFractionDigits: 0 });
const labW = i => R.lab[i] == null ? null : LB.w[R.lab[i]];

const MODES = {
  width: { label: "Ancho", legend: [["< 10 m", "#d9e6f5"], ["10–12", "#a9c7ea"], ["12–16", "#6fa0dc"], ["16–24", "#3a74c4"], ["24–35", "#1f4e96"], ["> 35", "#c2272d"]],
    color: i => { const w = R.w[i]; return w < 10 ? "#d9e6f5" : w < 12 ? "#a9c7ea" : w < 16 ? "#6fa0dc" : w < 24 ? "#3a74c4" : w <= 35 ? "#1f4e96" : "#c2272d"; } },
  cw: { label: "Calzadas", legend: [["1 calzada", "#7c8a99"], ["2, con camellón", "#e0602c"]], color: i => R.cw[i] === 2 ? "#e0602c" : "#7c8a99" },
  sides: { label: "Lados medidos", legend: [["0, estimado", "#d23b3b"], ["1", "#e8a33a"], ["2", "#3d9a57"]], color: i => ["#d23b3b", "#e8a33a", "#3d9a57"][R.ms[i]] },
  diff: { label: "vs. lab", legend: [["igual (±1 m)", "#a7a59f"], ["más ancho que el lab", "#c2272d"], ["más angosto", "#2f6fd6"], ["calzadas distintas", "#e8a33a"], ["sin pareja en el lab", "#8a63c9"]],
    color: i => { const l = R.lab[i]; if (l == null) return "#8a63c9"; if (LB.cw[l] !== R.cw[i]) return "#e8a33a";
      const d = R.w[i] - LB.w[l]; return d > 1 ? "#c2272d" : d < -1 ? "#2f6fd6" : "#a7a59f"; } },
};
const rgb = h => [1, 3, 5].map(k => parseInt(h.slice(k, k + 2), 16));
const st = { view: "street", mode: "width", sel: null };

document.getElementById("stats").innerHTML = [
  [S.rows.toLocaleString("es-MX"), "tramos"], [S.junctions.toLocaleString("es-MX"), "cruces"], [S.parts.toLocaleString("es-MX"), "bandas y carriles"],
  [`${S.dual} / ${S.dual_lab}`, "con camellón (porte / lab)"], [Math.round(100 * S.matched / S.rows) + " %", "con pareja en el lab"],
  [S.matched ? Math.round(100 * S.same / S.matched) + " %" : "—", "mismo ancho ±1 m"],
].map(([v, t]) => `<div class="stat"><b>${v}</b><span>${t}</span></div>`).join("");

// ------------------------------------------------------------------ mapa
const dark = matchMedia("(prefers-color-scheme: dark)").matches;
const BASE = `https://basemaps.cartocdn.com/gl/${dark ? "dark-matter" : "positron"}-gl-style/style.json`;
const SATELLITE = { version: 8, sources: { sat: { type: "raster", tileSize: 256, maxzoom: 19,
  tiles: ["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"],
  attribution: "Imagery © Esri, Maxar, Earthstar Geographics" } }, layers: [{ id: "sat", type: "raster", source: "sat" }] };
const map = new maplibregl.Map({ container: "map", attributionControl: { compact: true }, style: BASE,
  center: [X0, Y0], zoom: 15, maxZoom: 21 });
const overlay = new deck.MapboxOverlay({ interleaved: false, layers: [], getTooltip });
map.addControl(overlay); map.addControl(new maplibregl.NavigationControl({ showCompass: false }));

function getTooltip({ layer, index, object }) {
  if (!layer || index < 0) return null;
  if (layer.id === "rights" || layer.id === "axes") { const i = object.i;
    return { text: `${R.name[i] || "Sin nombre"} · ${fmt(R.w[i])} m${labW(i) != null ? ` (lab ${fmt(labW(i))} m)` : ""}` }; }
  if (layer.id === "junctions") return { text: `Cruce de ${J.streets[object.i]} extremos recortados` };
  if (layer.id === "inside") return { text: `Dentro del cruce: ${R.name[object.i] || "Sin nombre"} · ${R.cls[object.i]} · ${fmt(R.len[object.i])} m de eje` };
  if (layer.id === "lab") return { text: `Lab: ${fmt(LB.w[object.i])} m · ${LB.cw[object.i]} calzada(s)` };
  return null;
}
const $ = id => document.getElementById(id);
const on = id => $(id).checked;

function layers() {
  const out = [];
  if (on("l-lots")) out.push(new deck.PolygonLayer({ id: "lots", data: lotShapes, getPolygon: d => d.polygon, filled: true, stroked: true,
    getFillColor: dark ? [90, 86, 78, 70] : [205, 198, 184, 90], getLineColor: dark ? [120, 115, 105, 160] : [170, 162, 148, 170],
    lineWidthUnits: "pixels", getLineWidth: 0.5 }));
  if (st.view === "street") {
    out.push(
      new deck.PolygonLayer({ id: "inside", data: insideShapes, getPolygon: d => d.polygon, pickable: true, autoHighlight: true,
        highlightColor: [250, 204, 21, 70], filled: true, stroked: true, getFillColor: [124, 58, 237, on("l-sat") ? 70 : 110],
        getLineColor: [196, 181, 253, 230], lineWidthUnits: "pixels", getLineWidth: 1.2, getDashArray: [4, 3],
        extensions: [new deck.PathStyleExtension({ dash: true })] }),
      new deck.PolygonLayer({ id: "junctions", data: junctionShapes, getPolygon: d => d.polygon, pickable: true, autoHighlight: true,
        highlightColor: [250, 204, 21, 70], stroked: false, getFillColor: [63, 63, 70, on("l-sat") ? 110 : 225] }),
      new deck.PolygonLayer({ id: "parts", data: partShapes, getPolygon: d => d.polygon, filled: true, stroked: true,
        getFillColor: d => [...RGB[P.kind[d.i]], on("l-sat") ? 120 : P.kind[d.i] === 0 ? 240 : 225],
        getLineColor: d => P.kind[d.i] === 0 ? [168, 162, 158, 150] : [0, 0, 0, 0], lineWidthUnits: "pixels", getLineWidth: 0.5 }),
      new deck.PathLayer({ id: "marks", data: marks, getPath: d => d.path, getColor: [244, 244, 245, 230], widthUnits: "meters", getWidth: 0.15,
        widthMinPixels: 1, getDashArray: [20, 30], dashJustified: true, extensions: [new deck.PathStyleExtension({ dash: true })] }));
    if (on("l-axis")) out.push(new deck.PathLayer({ id: "axes-thin", data: axes, getPath: d => d.path, getColor: [250, 204, 21, 230],
      widthUnits: "pixels", getWidth: 1.2, getDashArray: [4, 3], extensions: [new deck.PathStyleExtension({ dash: true })] }));
    out.push(new deck.PolygonLayer({ id: "rights", data: rowShapes, getPolygon: d => d.polygon, pickable: true, autoHighlight: true,
      highlightColor: [250, 204, 21, 60], filled: true, stroked: true, getFillColor: [0, 0, 0, 0],
      getLineColor: d => d.i === st.sel ? [250, 204, 21, 255] : [0, 0, 0, 0], lineWidthUnits: "pixels", getLineWidth: d => d.i === st.sel ? 3 : 0,
      updateTriggers: { getLineColor: st.sel, getLineWidth: st.sel } }));
  } else {
    const real = on("real");
    out.push(new deck.PathLayer({ id: "axes", data: axes, getPath: d => d.path, pickable: true, autoHighlight: true, highlightColor: [250, 204, 21, 200],
      getColor: d => d.i === st.sel ? [250, 204, 21, 255] : [...rgb(MODES[st.mode].color(d.i)), real ? 150 : 240],
      widthUnits: real ? "meters" : "pixels", getWidth: d => real ? R.w[d.i] : (d.i === st.sel ? 5 : 2.5), widthMinPixels: 1.5, capRounded: false,
      updateTriggers: { getColor: [st.mode, st.sel, real], getWidth: [real, st.sel] } }));
  }
  if (on("l-lab")) out.push(new deck.PolygonLayer({ id: "lab", data: labShapes, getPolygon: d => d.polygon, pickable: st.view === "axes",
    filled: false, stroked: true, getLineColor: [138, 99, 201, 230], lineWidthUnits: "pixels", getLineWidth: 1.2 }));
  return out;
}
function draw() { overlay.setProps({ layers: layers(), onClick: info => { if (info.layer && (info.layer.id === "rights" || info.layer.id === "axes")) select(info.object.i); } }); }

// ------------------------------------------------------------------ panel
function legend() {
  const items = st.view === "street"
    ? [...KIND.map((_, k) => [KIND_ES[k], hex(RGB[k])]), ["Cruce", hex([63, 63, 70]) + "; outline:2px solid #facc15"], ["Tramo dentro del cruce", "#7c3aed; outline:2px dashed #c4b5fd"],["Contorno del lab", "transparent; border:2px solid #8a63c9"]]
    : MODES[st.mode].legend;
  $("legend").innerHTML = items.map(([t, c]) => `<div><span class="sw" style="background:${c}"></span>${t}</div>`).join("");
}
const views = $("views"), modes = $("modes");
views.innerHTML = [["street", "Calle, como el lab"], ["axes", "Ejes por atributo"]].map(([k, t]) => `<button data-k="${k}">${t}</button>`).join("");
modes.innerHTML = Object.entries(MODES).map(([k, m]) => `<button data-k="${k}">${m.label}</button>`).join("");
function refresh() {
  [...views.children].forEach(b => b.classList.toggle("on", b.dataset.k === st.view));
  [...modes.children].forEach(b => b.classList.toggle("on", b.dataset.k === st.mode));
  $("axisopts").style.display = st.view === "axes" ? "" : "none";
  legend(); draw();
}
views.onclick = e => { if (e.target.dataset.k) { st.view = e.target.dataset.k; refresh(); } };
modes.onclick = e => { if (e.target.dataset.k) { st.mode = e.target.dataset.k; refresh(); } };
["l-lots", "l-lab", "l-axis", "real"].forEach(id => $(id).onchange = draw);
$("l-sat").onchange = e => { map.setStyle(e.target.checked ? SATELLITE : BASE); draw(); };

// Corte transversal a escala: izquierda → derecha caminando del primer vértice al último.
function section(strips, axisAt, total, scale, label) {
  const W = 330, px = (W - 8) / scale; let x = 4, h = "";
  for (const [name, w, colour] of strips) {
    if (w <= 0) continue;
    h += `<rect x="${x}" y="14" width="${w * px}" height="22" fill="${colour}" stroke="#fafafa" stroke-width=".6"><title>${name}: ${fmt(w, 2)} m</title></rect>`;
    if (w * px > 18) h += `<text x="${x + w * px / 2}" y="48" font-size="9" fill="currentColor" text-anchor="middle">${fmt(w)}</text>`;
    x += w * px;
  }
  const ax = 4 + axisAt * px;
  h += `<line x1="${ax}" y1="8" x2="${ax}" y2="40" stroke="#facc15" stroke-width="1.5" stroke-dasharray="3 2"/>`;
  h += `<text x="4" y="9" font-size="9" fill="currentColor" opacity=".7">${label} · ${fmt(total)} m</text>`;
  return `<svg viewBox="0 0 ${W} 54" width="100%" style="color:var(--ink)">${h}</svg>`;
}
function portStrips(i) {
  const per = Math.max(1, Math.floor(R.lanes[i] / R.cw[i])), out = [];
  R.use[i].forEach((k, b) => { const w = R.w[i] * R.share[i][b] / 100;
    if (k === 1 || k === 3) for (let n = 0; n < per; n++) out.push([KIND_ES[k], w / per, hex(RGB[k])]);
    else out.push([KIND_ES[k], w, hex(RGB[k])]); });
  return out;
}
function labStrips(l) {  // como rowVisual del lab
  const total = (LB.wl[l] || 0) + (LB.wr[l] || 0), lanes = LB.lanes[l] || 0, lw = LB.lw[l] || 0, sl = LB.sl[l] || 0, sr = LB.sr[l] || 0;
  const dual = LB.cw[l] === 2, m = dual ? Math.max(0, total - sl - sr - lanes * lw) : 0;
  const asphalt = n => Array.from({ length: n }, () => ["Carril", lw, hex(RGB[1])]);
  return [["Banqueta", sl, hex(RGB[0])], ...(dual ? [...asphalt(lanes / 2), ["Camellón", m, hex(RGB[2])], ...asphalt(lanes / 2)] : asphalt(lanes)), ["Banqueta", sr, hex(RGB[0])]];
}
function select(i) {
  st.sel = i; draw();
  const l = R.lab[i], scale = Math.max(R.w[i], l != null ? LB.w[l] || 0 : 0);
  const sum = R.share[i].reduce((a, b) => a + b, 0);
  const bands = R.use[i].map((k, b) => `${KIND_ES[k]} ${fmt(R.w[i] * R.share[i][b] / 100)} m`).join(" · ");
  const rows = [["Clase", R.cls[i]], ["Ancho", `${fmt(R.w[i], 2)} m`], ["Izquierda · derecha", `${fmt(R.wl[i], 2)} · ${fmt(R.wr[i], 2)} m`],
    ["Calzadas · carriles", `${R.cw[i]} · ${R.lanes[i]}`], ...(R.cw[i] === 2 ? [["Camellón (entre ejes)", `${fmt(R.med[i])} m`]] : []),
    ["Lados medidos", R.ms[i] === 2 ? "2, ambos contra lotes" : R.ms[i] === 1 ? "1, el otro por clase" : "0, ancho por clase"],
    ["Giro", `${fmt(R.ang[i])}°`], ["Traslape con lotes", `${fmt(R.ov[i])} m²`], ["Largo del eje", `${fmt(R.len[i])} m`], ["Aristas OSM", R.nroads[i]],
    ["Ancho en el lab", l == null ? "sin pareja" : `${fmt(LB.w[l], 2)} m · ${LB.cw[l]} calz. · ${LB.ms[l]} lados`],
    ...(l != null ? [["Diferencia", `${R.w[i] - LB.w[l] >= 0 ? "+" : ""}${fmt(R.w[i] - LB.w[l], 2)} m`]] : [])];
  $("detail").className = "";
  $("detail").innerHTML = `<h3>${R.name[i] || "Sin nombre"}</h3><div class="k">${R.key[i]}</div>
    ${section(portStrips(i), R.w[i] / 2, R.w[i], scale, "Porte")}
    ${l != null ? section(labStrips(l), LB.wl[l] || 0, LB.w[l], scale, "Lab") : ""}
    <div class="cap">Izquierda → derecha caminando en el sentido del eje; la línea amarilla es el eje.</div>
    <div class="cap"><b>Bandas:</b> ${bands}</div>
    <table>${rows.map(([a, b]) => `<tr><td>${a}</td><td>${b}</td></tr>`).join("")}</table>
    ${Math.abs(sum - 100) > 0.01 ? `<div class="warn">Las bandas suman ${fmt(sum, 2)}, no 100</div>` : ""}
    ${R.inside.includes(i) ? `<div class="warn">Quedó entero dentro de un cruce: no tiene bandas propias en el mapa</div>` : ""}`;
}
function goTo(i, duration) {
  const b = new maplibregl.LngLatBounds(); axes[i].path.forEach(p => b.extend(p));
  map.fitBounds(b, { padding: 80, maxZoom: 19, ...(duration != null ? { duration } : {}) }); select(i);
}
function start() {
  const want = decodeURIComponent((location.hash.match(/tramo=([^&]+)/) || [])[1] || ""), i = R.key.indexOf(want);
  if (i >= 0) { goTo(i, 0); return; }
  const b = new maplibregl.LngLatBounds(); axes.forEach(a => a.path.forEach(p => b.extend(p))); map.fitBounds(b, { padding: 30, duration: 0 });
}

const link = (i, t) => `<a data-i="${i}">${t}</a>`;
const label = i => `${R.name[i] || "Sin nombre"} · ${fmt(R.w[i])} m`;
const bigDiff = R.w.map((w, i) => [i, labW(i) == null ? 0 : Math.abs(w - labW(i))]).filter(([, d]) => d >= 3).sort((a, b) => b[1] - a[1]).slice(0, 10);
$("review").innerHTML = `<div class="cap"><b>Más de 50 m de ancho</b></div>${S.outliers.map(i => link(i, label(i))).join("") || "Ninguno"}
  <div class="cap"><b>Mayor diferencia con el lab</b></div>${bigDiff.map(([i, d]) => link(i, `${label(i)} · ${fmt(d)} m de diferencia`)).join("") || "Ninguno"}
  <div class="cap"><b>Sin lotes de ningún lado</b> (${R.ms.filter(m => m === 0).length})</div>
  ${R.ms.map((m, i) => [m, i]).filter(([m]) => m === 0).sort((a, b) => R.len[b[1]] - R.len[a[1]]).slice(0, 5).map(([, i]) => link(i, label(i))).join("")}`;
$("quality").innerHTML = `<table style="width:100%;font-size:12px;border-collapse:collapse">${Object.entries(D.quality || {}).map(([k, v]) =>
  `<tr><td style="color:var(--muted);padding:2px 4px 2px 0;border-bottom:1px solid var(--line)">${k}</td><td style="text-align:right;border-bottom:1px solid var(--line)">${v}</td></tr>`).join("")}</table>`;
$("q").oninput = e => {
  const q = e.target.value.trim().toLowerCase();
  if (q.length < 3) { $("results").innerHTML = ""; return; }
  const hits = R.key.map((k, i) => i).filter(i => R.key[i].includes(q) || (R.name[i] || "").toLowerCase().includes(q)).slice(0, 12);
  $("results").innerHTML = hits.map(i => link(i, label(i))).join("") || "Sin resultados";
};
$("side").addEventListener("click", e => { if (e.target.dataset.i != null) goTo(+e.target.dataset.i); });
refresh();
start();
window.addEventListener("hashchange", start);
</script>
</body>
</html>
