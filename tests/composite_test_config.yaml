# A small composite tree for tests, independent of the bundled
# composite_config.yaml: one source of each kind, a composite inside another and
# a root with min_valid 1.
element: blocks
trees:
  - name: index
    phenomenon: positive
    min_valid: 1
    children:
      - name: proximity
        phenomenon: positive
        children:
          - name: health
            phenomenon: positive
            children:
              - name: health_facilities
                source: population_access
                variable: distance_m_health
                transform: {soft_threshold: 300}
                polarity: positive
                method: ampi
                reference: 0.5
                goalposts: {min: 0, max: 1}
              - name: health_services
                source: accessibility
                variable: distance_to_health_services
                transform: {soft_threshold: 10}
                polarity: positive
                method: ampi
                reference: 0.5
                goalposts: {min: 0, max: 1}
          - name: public_space
            source: population_access
            variable: distance_m_public_space
            transform: {soft_threshold: 300}
            polarity: positive
            method: ampi
            reference: 0.5
            goalposts: {min: 0, max: 1}
      - name: urban_form
        phenomenon: positive
        children:
          - name: density
            source: built_form
            variable: density
            polarity: positive
            method: ampi
            reference: 150
            goalposts: {min: 0, max: 400}
          - name: intensity
            source: built_form
            variable: cus
            polarity: positive
            method: ampi
            reference: 1.5
            goalposts: {min: 0, max: 4}
