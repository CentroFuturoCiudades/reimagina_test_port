[project]
name = "reimagina-test-port"
version = "0.1.0"
description = "Reimagina built-form indicators for Lyra"
readme = "README.md"
authors = [{ name = "RodolfoFigueroa", email = "rodolfo@daku.moe" }]
requires-python = ">=3.11"
dependencies = [
    "geopandas>=1.1.4",
    "lyra-sdk",
    "lyra-utils",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "psycopg[binary]>=3.3.4",
    "pyarrow",
    "pydantic",
]

[project.scripts]
reimagina-test-port = "reimagina_test_port:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    # Cliente HTTP de Lyra; solo lo usan los tests (no está en la imagen base).
    "lyra-api",
    "shapely",
    "coverage>=7.17.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "ty>=0.0.93",
    "ipykernel>=7.4.0",
]


[tool.pytest.ini_options]
markers = ["postgis: needs REIMAGINA_TEST_DSN (PostGIS in a container, see docs/verification.md)"]

[tool.lyra]
factory = "reimagina_test_port.plugin:create_plugin"

[tool.uv.sources]
# Mismo commit que la imagen base ghcr.io/rodolfofigueroa/lyra:0.25.0 (lyra-v0.25.0).
lyra-sdk = { git = "https://github.com/RodolfoFigueroa/lyra", subdirectory = "packages/lyra_sdk", rev = "2399c8e44ce57fba31ba270e5b421c20affa427a" }
lyra-api = { git = "https://github.com/RodolfoFigueroa/lyra", subdirectory = "packages/lyra_api", rev = "2399c8e44ce57fba31ba270e5b421c20affa427a" }
lyra-utils = { git = "https://github.com/RodolfoFigueroa/lyra", subdirectory = "packages/lyra_utils", rev = "2399c8e44ce57fba31ba270e5b421c20affa427a" }

[tool.uv.build-backend]
data = { data = "data" }
source-include = ["lyra.plugin.json", "docs/**", "tests/**", "scripts/**", "examples/**"]
